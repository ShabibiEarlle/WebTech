<form action="#" method="post">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" placeholder="Your name" required minlength="2" maxlength="30"><br><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" placeholder="you@example.com" required><br><br>

  <label for="pw">Password:</label>
  <input type="password" id="pw" name="pw" required minlength="8" maxlength="20"><br><br>

  <label for="dob">Date of birth:</label>
  <input type="date" id="dob" name="dob"><br><br>

  Gender:
  <input type="radio" id="m" name="gender" value="male"><label for="m">Male</label>
  <input type="radio" id="f" name="gender" value="female"><label for="f">Female</label><br><br>

  <input type="checkbox" id="agree" name="agree" required>
  <label for="agree">I agree to the terms</label><br><br>

  <label for="course">Course:</label>
  <select id="course" name="course">
    <option value="html">HTML</option>
    <option value="js">JavaScript</option>
    <option value="py">Python</option>
  </select><br><br>

  <label for="msg">Message:</label><br>
  <textarea id="msg" name="msg" rows="4" cols="40" maxlength="200" placeholder="Type here..."></textarea><br><br>

  <input type="submit" value="Submit">
  <input type="reset" value="Reset">
  <button type="button">Plain Button</button>
</form>
