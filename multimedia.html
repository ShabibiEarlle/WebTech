<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Multimedia</title></head>
<body>
  <h1>Multimedia</h1>

  <h2>Profile Pic</h2>
  <img src="mee.jpg" alt="My photo" width="300">

  <h2>Audio</h2>
  <audio controls>
    <source src="sound.mp3" type="audio/mpeg">
    Your browser does not support audio.
  </audio>

  <h2>Video</h2>
  <video controls width="400">
    <source src="clip.mp4" type="video/mp4">
    Your browser does not support video.
  </video>

  <h2>Embedded Content</h2>
  <iframe src="https://www.openstreetmap.org/export/embed.html" width="400" height="300" title="Map"></iframe>
</body>
</html>
