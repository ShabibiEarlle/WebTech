<main>
  <section>
    <h2>Contact Me</h2>
    <form action="#" method="post">
      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" required minlength="2" placeholder="Your name"><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required placeholder="you@example.com"><br><br>

      <label for="subject">Subject:</label><br>
      <input type="text" id="subject" name="subject" required maxlength="80"><br><br>

      <label for="message">Message:</label><br>
      <textarea id="message" name="message" rows="5" cols="40" required placeholder="Your message"></textarea><br><br>

      <input type="submit" value="Submit">
    </form>
  </section>
  <section>
    <h3>Find Me Here</h3>
    <iframe src="https://www.openstreetmap.org/export/embed.html" width="400" height="250" title="Map"></iframe>
  </section>
